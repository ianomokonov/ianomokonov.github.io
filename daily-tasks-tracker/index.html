<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Tasks Tracker</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- Собственные стили (цветовая схема из todo-list) -->
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <!-- Шапка -->
    <header class="app-header">
      <div>
        <h1 class="app-title"><i class="bi bi-list-check"></i> Daily Tasks Tracker</h1>
        <p class="app-subtitle">Трекер задач для подготовки к стендапу</p>
      </div>
      <button type="button" class="btn btn-primary" id="openAddModal">
        <i class="bi bi-plus-lg me-1"></i>Добавить
      </button>
    </header>

    <!-- Список задач (рендерится из JS) -->
    <main id="tasksContainer"></main>
  </div>

  <!-- Модальное окно добавления задачи -->
  <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="addForm" class="needs-validation" novalidate autocomplete="off">
          <div class="modal-header">
            <h2 class="modal-title fs-5" id="addModalLabel"><i class="bi bi-plus-circle me-2"></i>Добавить задачу</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="taskTitle" class="form-label">Название задачи <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="taskTitle" placeholder="Например: починил баг с авторизацией" required />
              <div class="invalid-feedback">Введите название задачи</div>
            </div>
            <div class="mb-3">
              <label for="taskUrl" class="form-label">Ссылка на задачу <span class="text-danger">*</span></label>
              <input type="url" class="form-control" id="taskUrl" placeholder="https://jira.example.com/TASK-123" required pattern="https?://.+" />
              <div class="invalid-feedback">Введите корректную ссылку (должна начинаться с http:// или https://)</div>
            </div>
            <div class="mb-3">
              <label for="taskComment" class="form-label">Комментарий</label>
              <textarea class="form-control" id="taskComment" rows="3" placeholder="Необязательно: что именно сделал, какие были сложности"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-ghost" data-bs-dismiss="modal">Отмена</button>
            <button type="submit" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Добавить</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS (нужен для модалки и collapse-аккордеонов) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Логика приложения -->
  <script src="script.js" defer></script>
</body>
</html>
